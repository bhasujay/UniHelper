<div class="dashboard-card create-session-modal">
    <button class="modal-close-btn" aria-label="Close">
        <img src="/unihelper/images/icons/icon-close-48.png" width="24" height="24" />
    </button>
    
    <h2 class="modal-title">Create a New Kuppi Session</h2>

    <form class="modal-form">
        <div class="form-group">
            <label for="session-title" class="form-label">Session Title</label>
            <input type="text" id="session-title" class="form-input" placeholder="e.g., Calculus 1 Revision">
        </div>

        <div class="form-group">
            <label for="subject" class="form-label">Subject</label>
            <select id="subject" class="form-select">
                <option>Computer Science</option>
                <option>Physics</option>
                <option>Mathematics</option>
                <option>Chemistry</option>
            </select>
        </div>

        <div class="form-group">
            <label for="description" class="form-label">Description</label>
            <textarea id="description" class="form-textarea" rows="3" placeholder="Describe what you'll cover in the session..."></textarea>
        </div>

        <div class="form-section">
            <h4 class="section-title">Time & Date</h4>
            <div class="time-inputs">
                <div class="form-group">
                    <label for="date" class="form-label">Date</label>
                    <input type="date" id="date" class="form-input">
                </div>
                <div class="form-group">
                    <label for="start-time" class="form-label">Start Time</label>
                    <input type="time" id="start-time" class="form-input">
                </div>
                <div class="form-group">
                    <label for="duration" class="form-label">Duration</label>
                    <select id="duration" class="form-select">
                        <option>1 hour</option>
                        <option>1.5 hours</option>
                        <option>2 hours</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="form-section">
            <h4 class="section-title">Location</h4>
            <div class="location-options">
                <label class="custom-radio">
                    <input type="radio" name="location" value="online" checked>
                    <span class="radio-dot"></span>
                    🌐 Online
                </label>
                <label class="custom-radio">
                    <input type="radio" name="location" value="in-person">
                    <span class="radio-dot"></span>
                    🏢 In-Person
                </label>
            </div>
            <div class="form-group" id="video-link-group">
                <input type="url" class="form-input" placeholder="Video Link (Zoom/Meet)">
            </div>
            <div class="form-group" id="in-person-group" style="display: none;">
                <input type="text" class="form-input" placeholder="Location Details (e.g., Library Room 3)">
            </div>
        </div>

        <div class="form-group">
            <label for="visibility" class="form-label">Visibility</label>
            <select id="visibility" class="form-select">
                <option>My University Only</option>
                <option>All Universities</option>
            </select>
        </div>

        <button type="submit" class="btn btn-primary btn-large create-session-btn">Create Session</button>
    </form>
</div>


<script>
    // Simple script to toggle location input fields
    document.querySelectorAll('input[name="location"]').forEach(radio => {
        radio.addEventListener('change', function() {
            const isOnline = this.value === 'online';
            document.getElementById('video-link-group').style.display = isOnline ? 'block' : 'none';
            document.getElementById('in-person-group').style.display = isOnline ? 'none' : 'block';
        });
    });
</script>
