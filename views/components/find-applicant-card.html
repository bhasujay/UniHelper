<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Applicants Card</title>

    <link rel="stylesheet" href="../css/style.css">
    
    <link rel="stylesheet" href="../css/cards.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body style="display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 2rem;">

    <div class="dashboard-card find-applicant-card">
        <div class="applicant-profile">
            <img src="https://i.pravatar.cc/80?u=user" alt="User Profile Picture" class="profile-avatar">
            <p class="username">User</p>
        </div>

        <div class="applicant-details">
            <div class="applicant-info">
                <h3>Intended Major: Computer Science</h3>
                <p>Science Stream</p>
            </div>
            
            <div class="applicant-match">
                <span>You have <strong>4 programs</strong> in common</span>
                <div class="match-strength-bar">
                    <div class="match-strength-fill" style="width: 80%;"></div>
                </div>
            </div>

            <div class="applicant-actions">
                <a href="#" class="btn btn-primary">Connect</a>
                <a href="#" class="btn btn-outline">View Shared Wishlist</a>
            </div>
        </div>
    </div>

</body>
</html>
