<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q&A Card</title>

    <link rel="stylesheet" href="../css/style.css">
    
    <link rel="stylesheet" href="../css/cards.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body style="display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 2rem;">

    <div class="dashboard-card q-and-a-card">
        <div class="qa-stats">
            <div class="stat-item">
                <span class="stat-number">+15</span>
                <span class="stat-label">Score</span>
            </div>
            <div class="stat-item answers-prominent">
                <span class="stat-number">3</span>
                <span class="stat-label">Answers</span>
            </div>
            <div class="stat-item">
                <span class="stat-number">142</span>
                <span class="stat-label">Views</span>
            </div>
        </div>

        <div class="qa-content">
            <div class="qa-main">
                <h3>What is the hostel fee for UCSC hostels?</h3>
                <p class="question-snippet">I'm an applicant from Jaffna and I'm trying to budget for my expenses if I get selected...</p>
                <div class="qa-tags">
                    <span class="tag">#university-colombo</span>
                    <span class="tag">#hostel-fees</span>
                    <span class="tag">#accommodation</span>
                </div>
            </div>
            <div class="qa-footer">
                <div class="qa-author">
                    <img src="https://i.pravatar.cc/32?u=user" alt="Author's profile picture">
                    <span>User</span>
                </div>
                <a href="#" class="btn btn-primary">Answer</a>
            </div>
        </div>
    </div>

</body>
</html>
