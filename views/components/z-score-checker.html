<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z-Score Checker Card</title>

    <link rel="stylesheet" href="views/css/style.css">
    <link rel="stylesheet" href="views/css/cards.css">
</head>
<body style="display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 2rem;">

<div class="dashboard-card z-score-card">
    <div class="card-main-action">
        <h2>Ready to find your course?</h2>
        <a href="#" class="btn btn-primary btn-large">Start Here</a>
    </div>

    <div class="card-secondary-actions">
        <a href="#" class="btn btn-outline">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 4v6h6"></path>
                <path d="M3.51 15a9 9 0 1 0 2.19-9.51L1 10"></path>
            </svg>
            <span>Recently Viewed</span>
        </a>
        <a href="#" class="btn btn-outline">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline>
                <polyline points="17 6 23 6 23 12"></polyline>
            </svg>
            <span>Popular Programs</span>
        </a>
    </div>
</div>
